[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "durospan"
version = "0.2.1"
description = "Typed, zero-dependency round-trip between human durations and seconds, one grammar both ways"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = [
    "duration",
    "timedelta",
    "parse",
    "format",
    "humanize",
    "roundtrip",
    "iso8601",
    "systemd",
    "prometheus",
    "go",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
durospan = "durospan._cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/durospan"
Issues = "https://github.com/JaviLianes8/durospan/issues"
Changelog = "https://github.com/JaviLianes8/durospan/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "CHANGELOG.md", "CONTRIBUTING.md", "GUIDE.md"]
exclude = ["**/__pycache__"]

[tool.hatch.build.targets.wheel]
packages = ["src/durospan"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src", "tests"]
addopts = "-q --doctest-modules"
